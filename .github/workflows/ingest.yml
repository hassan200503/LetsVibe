# Refreshes the Live Trends Engine every two hours by running the ingest
# script directly against the production database. Running it here instead of
# through a web request avoids free-tier function timeouts.
#
# Secret needed: DATABASE_URL (Neon connection string).
name: Ingest trends

on:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours, off the top of the hour
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: pnpm ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
